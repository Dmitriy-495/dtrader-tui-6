# Настройки пропорций главного лайаута TUI dtrader-6.
#
# Перечитывается один раз при СТАРТЕ TUI — изменения применяются
# только после перезапуска, без hot-reload (решение принято явно в
# ходе разработки).
#
# Отсутствие этого файла не ошибка — используются значения по
# умолчанию (см. internal/tui/settings.go: DefaultLayoutSettings),
# совпадающие с теми, что заданы здесь.

# Доля общей ширины терминала под правую панель (LOGS+POSITIONS).
# Остальное достаётся content (вкладки символов / Dashboard).
# Допустимый диапазон: 1-99.
rightbar_width_percent: 40

# Доля высоты ПРАВОЙ ПАНЕЛИ (не всего терминала), выделяемая под
# POSITIONS. Остаток достаётся LOGS. Допустимый диапазон: 1-99.
positions_height_percent: 30

# Фиксированная высота новостной ленты (строк), когда она появится
# внизу области контента. В отличие от двух настроек выше — это
# абсолютное число строк, не процент (задел на будущее, лента ещё не
# реализована на момент написания этого файла).
news_height_rows: 10
